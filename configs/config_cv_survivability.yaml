# config_cv_survivability.yaml
#
# (1) SURVIVABILITY: ALIVE / DEAD CLASSIFICATION
#
# Mangrove detection (YOLO) + survival-status classification (Keras) pipeline.
# Serves: POST /computer_vision/survivability_classifier/{,image,results}
# Source: veritree-survivability :: configs/config.yaml

pipeline:
  object_model_path:    '/src/models/mangrove_detection_model/mangrove_detection_model.pt'
  survival_model_path:  '/src/models/mangrove_classification_model/model.save'
  confidence:           0.4


pipeline_meta:
  border:       400
  pad_fraction: 0.25
  min_size:     50
  input_width:  224
  input_height: 224


classes:
  Alive:        [[1.0, 0.0, 0.0], 0]
  Dead/dormant: [[0.0, 1.0, 0.0], 1]
  Unclear:      [[0.0, 0.0, 1.0], 2]

