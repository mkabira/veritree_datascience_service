# config.yaml
#
# Service-level configuration for the veritree datascience service.
# Domain configuration lives alongside this file and is merged into one flat
# namespace by src/utils/context.py :: load_config():
#
#   config_cv_survivability.yaml               (1) alive/dead classification
#   config_cv_content_tagging.yaml             (2) content tagging of photo evidence
#   config_cv_content_moderation.yaml          (3) AI content moderation (AICM)
#   config_cv_verification_summarization.yaml  (4) planting partners summarization
#   config_datascience_results.yaml            datascience_results routes
#
# Every top-level key must be unique across all three files.

prod_mode: True

repo:
  name:         'veritree_datascience_service'
  description:  'Unified veritree datascience API: computer vision inference and analytics results'
  version:      '0.1.0'

api_config:
  host: '0.0.0.0'
  port: 8000

logging:
  filename:     'veritree_datascience_service.log'
  level:        'INFO'
  max_bytes:    10485760   # 10 MB per file
  backup_count: 5          # keep 5 rotations -> 60 MB ceiling on disk
